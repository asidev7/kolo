# /etc/nginx/sites-available/kolo — API KOLO.
# Activer : ln -s /etc/nginx/sites-available/kolo /etc/nginx/sites-enabled/
# TLS      : certbot --nginx -d api.asitechsolution.cloud
#
# Ces directives sont de contexte « http » : le fichier étant inclus dans le
# bloc http de nginx.conf, elles y sont valides.

limit_req_zone $binary_remote_addr zone=kolo_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kolo_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name api.asitechsolution.cloud;

    # Un lot de 100 opérations tient largement dans 1 Mo.
    client_max_body_size 1m;
    server_tokens off;

    # Aucune page web : seule l'API répond, tout le reste est un 404.
    location / { return 404; }

    # Cibles privilégiées des tentatives de connexion : cadence serrée.
    location /api/v1/auth/ {
        limit_req zone=kolo_auth burst=10 nodelay;
        include /etc/nginx/proxy_params_kolo;
    }

    location /api/ {
        limit_req zone=kolo_api burst=40 nodelay;
        include /etc/nginx/proxy_params_kolo;
    }
}
