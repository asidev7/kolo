name: kolo
description: "KOLO — Ton argent. Tes décisions. Ton avenir. By ASITECH SOLUTION."
publish_to: 'none'

# La version affichée dans le profil (§J) est dérivée de ces deux valeurs.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # État et injection de dépendances
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.2

  # Persistance locale — SQLite est la source de vérité pour l'interface
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # Utilitaires transverses
  intl: ^0.20.3
  uuid: ^4.6.0
  clock: ^1.1.3
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  collection: ^1.19.1
  meta: ^1.19.0
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Génération de code (Drift, Riverpod)
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  riverpod_generator: ^4.0.9

  # Tests
  mocktail: ^1.0.5

  # Icônes de lancement
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Police embarquée : aucun téléchargement réseau à l'exécution (§2.2).
  # Graisses 400/500/600/700 — celles que l'échelle typographique utilise.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Icône de lancement dérivée du sigle « K » à feuille du logo KOLO.
# `flutter pub run flutter_launcher_icons` régénère les ressources natives.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/kolo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/kolo_icon_foreground.png"
  # iOS refuse la transparence sur l'icône : le fond est composité.
  remove_alpha_ios: true
