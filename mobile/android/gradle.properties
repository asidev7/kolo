# Machine de dev à 8 Go de RAM : un heap de 8 Go provoquait des crashs JVM
# (hs_err_pid*.log, « insufficient memory »). 1 Go suffit sans R8 (voir
# build.gradle.kts). Limiter les workers réduit encore la charge native.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Pas de démon Kotlin séparé : un processus JVM de moins sur une machine à 8 Go.
kotlin.compiler.execution.strategy=in-process
